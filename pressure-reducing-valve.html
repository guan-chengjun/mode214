<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隔膜式自来水减压阀 3D 仿真</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }

  /* ---------- 侧边控制面板 ---------- */
  #panel {
    position: fixed; top: 16px; right: 16px; width: 250px;
    background: rgba(255,255,255,0.94); border: 1px solid #d4d9de;
    border-radius: 10px; padding: 14px 16px 16px;
    box-shadow: 0 4px 18px rgba(30,45,60,0.12);
    color: #2b3440; font-size: 13px; user-select: none;
  }
  #panel h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: #1f2a36; }
  .ctrl { margin-bottom: 12px; }
  .ctrl label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #4a5560; }
  .ctrl label b { color: #0b5cad; font-variant-numeric: tabular-nums; }
  .ctrl input[type=range] { width: 100%; accent-color: #0b5cad; cursor: pointer; }
  #resetBtn {
    width: 100%; padding: 7px 0; margin: 2px 0 10px;
    background: #0b5cad; color: #fff; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  #resetBtn:hover { background: #094d91; }
  .stats { border-top: 1px solid #e2e6ea; padding-top: 10px; }
  .stat { display: flex; justify-content: space-between; padding: 3px 0; }
  .stat span { color: #6a7480; }
  .stat b { color: #1f2a36; font-variant-numeric: tabular-nums; }
  .stat b.hot { color: #c0392b; } /* 出口超压时变红 */

  /* ---------- 标题与操作提示 ---------- */
  #title {
    position: fixed; top: 16px; left: 16px; color: #2b3440;
    background: rgba(255,255,255,0.85); border-radius: 8px; padding: 8px 14px;
    font-size: 14px; font-weight: 600; box-shadow: 0 2px 10px rgba(30,45,60,0.08);
  }
  #title small { display: block; font-weight: 400; color: #7a8490; margin-top: 2px; }
  #hint {
    position: fixed; bottom: 12px; left: 16px; color: #7a8490; font-size: 12px;
    background: rgba(255,255,255,0.75); padding: 4px 10px; border-radius: 6px;
  }
</style>
</head>
<body>

<div id="title">隔膜式自来水减压阀 · 内部动作仿真<small>半透明外壳 / 隔膜 - 阀芯 - 弹簧联动</small></div>

<div id="panel">
  <h2>控制面板</h2>
  <div class="ctrl">
    <label>进水压力 <b><span id="pInVal">0.60</span> MPa</b></label>
    <input id="pInSlider" type="range" min="0.10" max="1.00" step="0.01" value="0.60">
  </div>
  <div class="ctrl">
    <label>调压设定（弹簧预紧） <b><span id="pSetVal">0.25</span> MPa</b></label>
    <input id="pSetSlider" type="range" min="0.05" max="0.60" step="0.01" value="0.25">
  </div>
  <button id="resetBtn">重 置</button>
  <div class="stats">
    <div class="stat"><span>进水压力</span><b id="readIn">0.60 MPa</b></div>
    <div class="stat"><span>出口压力</span><b id="readOut">0.00 MPa</b></div>
    <div class="stat"><span>阀芯开度</span><b id="readOpen">50 %</b></div>
  </div>
</div>

<div id="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =====================================================================
 * 0. 仿真状态与常量
 * =================================================================== */
const TRAVEL = 0.28;          // 阀芯全行程（米，场景单位）
const SPRING_H0 = 0.45;       // 弹簧建模原始长度
const PRELOAD_TRAVEL = 0.40;  // 调节螺杆最大下压行程

const state = {
  pIn:  0.60,   // 进水压力 MPa（滑块控制）
  pSet: 0.25,   // 稳压设定值 MPa（弹簧预紧，滑块控制）
  pOut: 0.00,   // 出口压力 MPa（仿真计算）
  x:    0.50,   // 阀芯开度 0~1（仿真计算）
};
const DEFAULTS = { ...state };

/* =====================================================================
 * 1. 渲染器 / 场景 / 相机 / 控制器 / 灯光
 * =================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // 软阴影
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.8, 2.8, 4.6);

// OrbitControls 默认即：左键旋转 / 滚轮缩放 / 右键平移
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.55;   // 限制不要钻到地面以下太多

// 环境光 + 方向光（投影）
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(4, 7, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);        // 适中的阴影贴图尺寸，兼顾流畅
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6;   sun.shadow.camera.bottom = -6;
sun.shadow.camera.far = 20;
sun.shadow.bias = -0.0005;
scene.add(sun);

// 地面（接收阴影）
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0xdde2e6, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* =====================================================================
 * 2. 材质
 * =================================================================== */
const MAT = {
  // 半透明外壳：便于观察内部运动部件
  shell: new THREE.MeshPhysicalMaterial({
    color: 0x9db4c8, transparent: true, opacity: 0.25,
    roughness: 0.15, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false,
  }),
  steel:  new THREE.MeshStandardMaterial({ color: 0x9aa2ab, metalness: 0.9,  roughness: 0.35 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x4a5058, metalness: 0.7,  roughness: 0.5 }),
  brass:  new THREE.MeshStandardMaterial({ color: 0xb08d2f, metalness: 0.85, roughness: 0.3 }),  // 阀芯
  spring: new THREE.MeshStandardMaterial({ color: 0x707880, metalness: 0.9,  roughness: 0.3 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x3a3f44, metalness: 0.0,  roughness: 0.9 }),  // 隔膜
  dial:   new THREE.MeshStandardMaterial({ color: 0xf5f6f7, metalness: 0.1,  roughness: 0.6 }),
  needle: new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.3,  roughness: 0.5 }),
};

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  m.receiveShadow = shadow;
  parent.add(m);
  return m;
}

/* =====================================================================
 * 3. 程序化外壳（GLB 低模加载失败时的自动回退方案）
 *    结构：下腔体(阀腔) + 上腔体(弹簧腔) + 进出水法兰管 + 支承
 * =================================================================== */
const PIPE_Y = 1.1;   // 管道中心高度
const shellGroup = new THREE.Group();
scene.add(shellGroup);

function buildProceduralShell() {
  const g = shellGroup;
  const S = MAT.shell, T = MAT.dark;

  // 下腔体（阀腔），半透明
  mesh(new THREE.CylinderGeometry(0.70, 0.70, 1.30, 40), S, 0, 1.05, 0, g, false);
  mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.08, 40), S, 0, 0.42, 0, g, false); // 下腔底盖
  // 上腔体（弹簧腔），半透明
  mesh(new THREE.CylinderGeometry(0.62, 0.62, 1.10, 40), S, 0, 2.25, 0, g, false);
  mesh(new THREE.CylinderGeometry(0.64, 0.64, 0.12, 40), S, 0, 2.84, 0, g, false); // 顶盖
  mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.16, 20), T, 0, 2.92, 0, g);        // 顶盖螺杆凸台
  // 隔膜夹持法兰（上下腔分界处的一圈法兰）
  mesh(new THREE.CylinderGeometry(0.74, 0.74, 0.07, 40), T, 0, 1.70, 0, g);
  // 阀杆导向衬套
  mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.26, 16), MAT.steel, 0, 1.62, 0, g);

  // 进 / 出水管道与法兰
  for (const side of [-1, 1]) {
    const pipe = mesh(new THREE.CylinderGeometry(0.26, 0.26, 1.95, 28), MAT.steel, side * 1.55, PIPE_Y, 0, g);
    pipe.rotation.z = Math.PI / 2;
    for (const fx of [0.68, 2.32]) {
      const fl = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.10, 28), T, side * fx, PIPE_Y, 0, g);
      fl.rotation.z = Math.PI / 2;
    }
    // 管道支承
    mesh(new THREE.BoxGeometry(0.14, PIPE_Y - 0.26, 0.14), T, side * 2.0, (PIPE_Y - 0.26) / 2, 0, g);
    mesh(new THREE.BoxGeometry(0.4, 0.06, 0.4), T, side * 2.0, 0.03, 0, g);
  }
  // 阀体底部支座
  mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.38, 28), T, 0, 0.19, 0, g);
}
buildProceduralShell();

/* ---------- 可选：下载公开轻量化阀门 GLB 低模作为外壳 ----------
 * 在 VALVE_MODEL_URL 中填入任意公开可访问的阀门 GLB 直链
 * （例如 jsdelivr 托管的 GitHub 模型）。加载成功后自动缩放对齐
 * 场景坐标并设为半透明，替换上面的程序化外壳；
 * 留空、跨域失败或超时（8s）时自动保留程序化基础几何体外壳。 */
const VALVE_MODEL_URL = ''; // 例如 'https://cdn.jsdelivr.net/gh/<user>/<repo>@main/valve.glb'
(function tryLoadShellModel() {
  if (!VALVE_MODEL_URL) return;
  let done = false;
  setTimeout(() => { done = true; }, 8000); // 超时保护：超时后忽略迟到的模型
  new GLTFLoader().load(VALVE_MODEL_URL, (gltf) => {
    if (done) return; done = true;
    const model = gltf.scene;
    // 自动缩放对齐：按包围盒把模型高度归一到 3.4，底面落到地面、中心对齐阀轴
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const s = 3.4 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(s);
    box.setFromObject(model);
    const c = box.getCenter(new THREE.Vector3());
    model.position.sub(c).add(new THREE.Vector3(0, 1.7, 0));
    model.traverse((o) => {
      if (o.isMesh) {
        o.material = MAT.shell;   // 统一替换为半透明材质，简化纹理、规避贴图跨域
        o.castShadow = false;
      }
    });
    shellGroup.visible = false;   // 用下载的低模替换程序化外壳
    scene.add(model);
  }, undefined, () => { /* 加载失败：保留程序化外壳，无需处理 */ });
})();

/* =====================================================================
 * 4. 内部运动机构（始终程序化建模，保证联动逻辑精确）
 * =================================================================== */

/* ---- 4.1 阀芯运动组：阀芯 + 阀杆 + 隔膜 + 弹簧下座，整体随开度 x 上下移动 ----
 * 真实隔膜式减压阀中，弹簧把隔膜向下顶 → 阀芯离开阀座（开大）；
 * 出口压力作用在隔膜下方把它向上推 → 阀芯靠近阀座（关小）。 */
const valveGroup = new THREE.Group();
scene.add(valveGroup);

// 阀芯（黄铜锥形阀瓣，顶点朝上嵌入阀座）
mesh(new THREE.ConeGeometry(0.20, 0.18, 28), MAT.brass, 0, 1.06, 0, valveGroup);
mesh(new THREE.CylinderGeometry(0.20, 0.22, 0.08, 28), MAT.brass, 0, 0.95, 0, valveGroup);
// 阀杆
mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.15, 12), MAT.steel, 0, 1.58, 0, valveGroup);
// 隔膜（压扁的半球穹顶，可随压差轻微变形）
const diaphragm = mesh(
  new THREE.SphereGeometry(0.55, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2),
  MAT.rubber, 0, 2.12, 0, valveGroup
);
diaphragm.scale.y = 0.3;
mesh(new THREE.TorusGeometry(0.55, 0.03, 10, 40), MAT.rubber, 0, 2.12, 0, valveGroup)
  .rotation.x = Math.PI / 2; // 隔膜边缘压圈
// 隔膜上压板 & 弹簧下座
mesh(new THREE.CylinderGeometry(0.40, 0.40, 0.05, 28), MAT.steel, 0, 2.20, 0, valveGroup);
mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 28), MAT.dark, 0, 2.28, 0, valveGroup);

/* ---- 4.2 阀座（固定件）：阀芯上行时锥面贴紧阀座内孔实现关闭 ---- */
const seat = mesh(new THREE.TorusGeometry(0.24, 0.055, 12, 32), MAT.steel, 0, PIPE_Y, 0);
seat.rotation.x = Math.PI / 2;
mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.07, 28), MAT.dark, 0, PIPE_Y - 0.06, 0);

/* ---- 4.3 调节螺杆组：旋钮 + 螺杆 + 弹簧上座，随调压滑块上下移动 ---- */
const screwGroup = new THREE.Group();
scene.add(screwGroup);
mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.62, 16), MAT.steel, 0, 3.12, 0, screwGroup); // 螺杆
const knob = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.14, 24), MAT.dark, 0, 3.48, 0, screwGroup); // 调节旋钮
mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.06, 16), MAT.steel, 0, 3.58, 0, screwGroup);
mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 28), MAT.dark, 0, 2.74, 0, screwGroup);  // 弹簧上座

/* ---- 4.4 弹簧：螺旋线扫掠成管，整体建模高度 SPRING_H0，
 *        运行时按两端实际距离做 Y 向缩放来表现压缩量 ---- */
const spring = (() => {
  const coils = 6, pts = [];
  const segs = coils * 24;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, a = t * coils * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * 0.33, t * SPRING_H0, Math.sin(a) * 0.33));
  }
  const m = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), segs * 2, 0.035, 8, false),
    MAT.spring
  );
  m.castShadow = true;
  scene.add(m);
  return m;
})();

/* ---- 4.5 压力表（外壳 + 表盘 + 指针），进水侧 / 出水侧各一只 ---- */
function buildGauge(px) {
  const g = new THREE.Group();
  g.position.set(px, PIPE_Y + 0.55, 0);
  g.rotation.x = -0.18; // 表盘略向观察者倾斜
  scene.add(g);
  mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.26, 10), MAT.steel, px, PIPE_Y + 0.28, 0); // 表下引压管
  const body = mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.10, 28), MAT.dark, 0, 0, 0, g);
  body.rotation.x = Math.PI / 2; // 表壳轴线朝 +Z
  mesh(new THREE.CircleGeometry(0.20, 28), MAT.dial, 0, 0, 0.051, g, false);
  const rim = mesh(new THREE.TorusGeometry(0.22, 0.02, 10, 32), MAT.steel, 0, 0, 0.05, g, false);
  // 刻度线（0~1.0 MPa 对应 -120°~+120°）
  for (let i = 0; i <= 10; i++) {
    const a = THREE.MathUtils.degToRad(120 - i * 24);
    const tick = mesh(new THREE.BoxGeometry(0.008, i % 5 === 0 ? 0.045 : 0.025, 0.004),
      MAT.dark, Math.sin(a) * 0.175, Math.cos(a) * 0.175, 0.055, g, false);
    tick.rotation.z = -a;
  }
  // 指针（几何原点移到针尾，绕表心旋转）
  const needleGeo = new THREE.BoxGeometry(0.018, 0.16, 0.008);
  needleGeo.translate(0, 0.07, 0);
  const needle = mesh(needleGeo, MAT.needle, 0, 0, 0.06, g, false);
  mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.02, 12), MAT.dark, 0, 0, 0.06, g, false)
    .rotation.x = Math.PI / 2;
  return needle;
}
const inletNeedle = buildGauge(-1.7);
const outletNeedle = buildGauge(1.7);
const needleAngle = (p) => THREE.MathUtils.degToRad(240 * THREE.MathUtils.clamp(p / 1.0, 0, 1) - 120);

/* =====================================================================
 * 5. 压力 — 阀芯开度联动仿真核心
 *    模型：出口压力 = 进水压力 × 阀芯节流特性 f(x)，带一阶惯性；
 *    隔膜受力平衡 → 阀芯按偏差 (pSet - pOut) 比例调节，带速度限幅
 *    与行程限位（0~1），保证阀芯不脱离行程、部件不穿插。
 * =================================================================== */
function stepSimulation(dt) {
  // 阀芯节流特性：开度越大，下游压力越接近上游
  const pOutIdeal = state.pIn * Math.pow(state.x, 0.65);
  // 出口压力一阶惯性（模拟下游腔体充放压过程）
  state.pOut += (pOutIdeal - state.pOut) * Math.min(1, dt * 2.5);

  // 隔膜力平衡的比例调节：出口压力低于设定 → 弹簧占优，阀芯开大；反之关小
  let vx = (state.pSet - state.pOut) * 3.0;
  vx = THREE.MathUtils.clamp(vx, -0.8, 0.8);          // 阀芯速度限幅（运动限位）
  state.x = THREE.MathUtils.clamp(state.x + vx * dt, 0, 1); // 行程限位 0~1
}

/* ---- 机构位姿更新：把仿真量映射到各运动部件 ---- */
function updateMechanism() {
  const x = state.x;
  // 阀芯组：开度越大位置越低（弹簧顶开），限位行程 TRAVEL
  valveGroup.position.y = -x * TRAVEL;
  // 调节螺杆组：设定压力越高，螺杆下压越多（弹簧预紧力越大）
  const preloadNorm = (state.pSet - 0.05) / 0.55;
  screwGroup.position.y = -preloadNorm * PRELOAD_TRAVEL;
  // 隔膜随压差轻微弹性变形（视觉反馈）
  diaphragm.scale.y = 0.3 * (1 + THREE.MathUtils.clamp((state.pOut - state.pSet) * 2, -0.35, 0.35));

  // 弹簧：下端随阀芯组、上端随螺杆组，按实际间距缩放
  const yBottom = 2.33 + valveGroup.position.y;
  const yTop = 2.72 + screwGroup.position.y;
  spring.position.y = yBottom;
  spring.scale.y = Math.max(0.15, yTop - yBottom) / SPRING_H0; // 最小压缩量限位，防止穿插

  // 压力表指针
  inletNeedle.rotation.z = needleAngle(state.pIn);
  outletNeedle.rotation.z = needleAngle(state.pOut);
}

/* =====================================================================
 * 6. 控制面板绑定
 * =================================================================== */
const $ = (id) => document.getElementById(id);
const pInSlider = $('pInSlider'), pSetSlider = $('pSetSlider');

pInSlider.addEventListener('input', () => {
  state.pIn = parseFloat(pInSlider.value);
  $('pInVal').textContent = state.pIn.toFixed(2);
});
pSetSlider.addEventListener('input', () => {
  state.pSet = parseFloat(pSetSlider.value);
  $('pSetVal').textContent = state.pSet.toFixed(2);
});
$('resetBtn').addEventListener('click', () => {
  Object.assign(state, DEFAULTS);                 // 参数与部件位置回初始状态
  pInSlider.value = DEFAULTS.pIn;
  pSetSlider.value = DEFAULTS.pSet;
  $('pInVal').textContent = DEFAULTS.pIn.toFixed(2);
  $('pSetVal').textContent = DEFAULTS.pSet.toFixed(2);
});

function updatePanel() {
  $('readIn').textContent = state.pIn.toFixed(2) + ' MPa';
  $('readOut').textContent = state.pOut.toFixed(2) + ' MPa';
  $('readOpen').textContent = Math.round(state.x * 100) + ' %';
  // 出口压力超过设定值 10% 时读数标红提示
  $('readOut').classList.toggle('hot', state.pOut > state.pSet * 1.1);
}

/* =====================================================================
 * 7. 主循环与自适应
 * =================================================================== */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); // 帧率骤降时限制步长，保证仿真稳定
  stepSimulation(dt);
  updateMechanism();
  updatePanel();
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
